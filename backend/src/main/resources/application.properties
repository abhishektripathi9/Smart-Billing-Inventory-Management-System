# ===================================================================
# Smart Billing & Inventory Management System (PosSaaS) Configuration
# ===================================================================
server.port=8080
spring.application.name=smart-billing-backend

# Active profile: set to 'mysql' when running against a live MySQL server
# spring.profiles.active=mysql
spring.profiles.active=dev

# In Dev Profile: Embedded H2 database with persistence for instant zero-friction running
spring.datasource.url=jdbc:h2:mem:smartbilling;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 Console (Accessible at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Jackson JSON Formatter
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=Asia/Kolkata

